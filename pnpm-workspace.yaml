packages:
  - packages/*
  - apps/*

# Supply-chain hardening: only install versions that have been public for at least 3 days, so a
# hijacked release is usually caught and unpublished before it reaches this repo.
minimumReleaseAge: 4320

# Dependencies allowed to run install scripts.
allowBuilds:
  esbuild: true

# GHSA-g3hv-75wg-m249 (minimatch DoS via globparts amplification) is fixed only in 11.x, which
# ESLint and typescript-eslint don't allow yet (they ask for ^10). Lint runs fine on 11; remove
# this override once they move to it.
overrides:
  minimatch: ^11.0.3
