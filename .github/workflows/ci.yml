name: CI

# Every change reaches main through a pull request (or the merge queue), which runs these checks
# first, so pushes to main don't run them again.
on:
  pull_request:
  merge_group:
  # The release workflow runs these checks before publishing.
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check spelling
        run: pnpm spellcheck

      - name: Lint
        run: pnpm lint

      # The docs typecheck against the built packages, the way an app would use them.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Test the docs pages
        run: pnpm --filter docs-react test

      # Real framework builds, using the libraries built above:
      # - Next.js fails if a server module imports a hook, and its prerendered HTML shows the
      #   server render of each kind of component.
      # - SolidStart renders the page on the server, and its form posts to a server action
      #   without JavaScript.
      - name: Test with Next.js and SolidStart (SSR, Server Components, server actions)
        run: pnpm test:fixtures

      - name: Check the published packages
        run: pnpm lint:package
