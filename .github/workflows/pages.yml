name: Docs

# One site: a landing page at the root, the React docs under /react/ and the Solid docs under
# /solid/. Change a docs workflow by hand-running it from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "apps/docs-*/**"
      - "apps/landing/**"
      - "packages/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions: {}

# One deployment at a time; a newer push waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No dependency cache: this workflow deploys, so it never restores state another run wrote.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        env:
          # e.g. /ui-components for https://boltronx.github.io/ui-components/
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          pnpm --filter "./packages/*" build
          DOCS_BASE="$BASE/react/" pnpm --filter docs-react build
          DOCS_BASE="$BASE/solid/" pnpm --filter docs-solid build
          mkdir -p site
          cp -R apps/landing/. site/
          cp -R apps/docs-react/dist site/react
          cp -R apps/docs-solid/dist site/solid

      # Served at <site>/coverage-<name>.json for the READMEs' shields.io endpoint badges.
      - name: Coverage badges
        run: |
          pnpm test:coverage
          for name in react-ui solid-ui; do
            pnpm --filter "@boltronx/$name" exec node scripts/coverage-badge.mjs "../../site/coverage-$name.json"
          done

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
